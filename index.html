<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>翼间手记 · 宋真个人博客</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="top">
    <span class="brand"><span aria-hidden="true">✳</span> 翼间手记</span>
    <span id="identity" class="muted">YEARNWINGWINGS / JOURNAL</span>
    <button id="leave" class="quiet" type="button" hidden>返回入口</button>
  </header>
  <main>
    <div class="hero">
      <div class="eyebrow">✦ &nbsp; PERSONAL JOURNAL</div>
      <h1>翼间手记<span>。</span></h1>
      <p>把日常写下来，把值得留住的画面收藏起来。</p>
    </div>
    <section id="entry" class="card" aria-labelledby="entry-title">
      <h2 id="entry-title">翻开手记</h2>
      <form id="nickname-form">
        <label>昵称<input id="nickname" name="nickname" maxlength="30" required placeholder="你希望我怎么称呼你？"></label>
        <button class="primary" type="submit">进入博客</button>
      </form>
      <noscript><p>请启用 JavaScript 后使用昵称进入。</p></noscript>
    </section>
    <section id="journal" aria-labelledby="journal-title" hidden>
      <div class="section-title"><h2 id="journal-title" tabindex="-1">最新手记</h2></div>
      <div id="posts">
        <!-- 发布新手记时，在这里添加 article。 -->
        <article class="card post">
          <h3>欢迎来到翼间手记</h3>
          <p>这里是宋真的个人博客。以后的文字、照片和故事，都会慢慢放在这里。</p>
        </article>
      </div>
    </section>
  </main>
  <footer>翼间手记 <span>✦</span> YEARNWINGWINGS</footer>
</body>
</html>
